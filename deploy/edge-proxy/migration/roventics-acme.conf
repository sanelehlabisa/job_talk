# Temporary config for the EXISTING Roventics proxy during certificate preparation.
# Compare to its live config first. Keep / and /api/ behavior from the old stack.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
resolver 127.0.0.11 valid=5s ipv6=off;
server {
    listen 80;
    server_name _;
    location ^~ /.well-known/acme-challenge/ {
        set $edge roventics-edge:80;
        proxy_pass http://$edge$request_uri;
        proxy_set_header Host $host;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    location / {
        set $frontend roventics-frontend:80;
        proxy_pass http://$frontend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        set $backend roventics-backend:8080;
        proxy_pass http://$backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
