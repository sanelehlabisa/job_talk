# Independent VPS-wide stack; copy this directory to ~/apps/edge-proxy.
name: roventics_edge
services:
  proxy:
    build: ./nginx
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Read APP_DOMAIN from the existing Job Talk environment}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certificates:/etc/letsencrypt:ro
      - acme:/var/www/certbot:ro
      - jobtalk_socket:/run/jobtalk:ro
      - ./secrets/jobtalk.htpasswd:/etc/nginx/auth/.htpasswd:ro
    tmpfs:
      - /etc/nginx/conf.d:size=2m
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=16m
    networks:
      edge:
        aliases: [roventics-edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/edge-health"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt: ["no-new-privileges:true"]

  certbot:
    image: certbot/certbot@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    profiles: [certificate-tools]
    volumes:
      - certificates:/etc/letsencrypt
      - acme:/var/www/certbot

  certbot-renew:
    image: certbot/certbot@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    restart: unless-stopped
    init: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trap 'exit 0' TERM INT
        while :; do
          certbot renew --webroot --webroot-path /var/www/certbot --quiet || echo 'Certificate renewal failed; inspect certbot-renew logs' >&2
          sleep 43200 & wait $$!
        done
    volumes:
      - certificates:/etc/letsencrypt
      - acme:/var/www/certbot
    security_opt: ["no-new-privileges:true"]

networks:
  edge:
    external: true
    name: roventics_edge
volumes:
  certificates:
    external: true
    name: roventics_edge_certificates
  acme:
    external: true
    name: roventics_edge_acme
  jobtalk_socket:
    external: true
    name: jobtalk_backend_socket
