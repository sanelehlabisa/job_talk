# Install as /etc/nginx/sites-available/jobtalk on the VM.
# Certbot adds HTTPS and the HTTP redirect after DNS resolves to this server.
server {
    listen 80;
    server_name jobtalk.roventics.com;
    if ($host != "jobtalk.roventics.com") { return 444; }
    client_max_body_size 128k;
    # Log neither query strings nor request bodies (the app gateway logs status).
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_read_timeout 60s;
    }
}
