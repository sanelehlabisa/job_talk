services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_talk}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - job_talk_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: python:3.12-slim
    working_dir: /app
    init: true
    restart: unless-stopped
    volumes:
      - ./backend:/app:ro
      - backend_venv:/opt/venv
    environment:
      PATH: /opt/venv/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
      APP_ENV: ${APP_ENV:-development}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,testserver}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      EMAIL_FROM: ${EMAIL_FROM:-login@example.com}
      RECRUITER_CODE_TTL_MINUTES: ${RECRUITER_CODE_TTL_MINUTES:-10}
      RECRUITER_CODE_MAX_ATTEMPTS: ${RECRUITER_CODE_MAX_ATTEMPTS:-5}
      RECRUITER_CODE_REQUEST_COOLDOWN_SECONDS: ${RECRUITER_CODE_REQUEST_COOLDOWN_SECONDS:-60}
      RECRUITER_CODE_REQUEST_MAX_PER_HOUR: ${RECRUITER_CODE_REQUEST_MAX_PER_HOUR:-5}
      DEMO_DATA_RETENTION_DAYS: ${DEMO_DATA_RETENTION_DAYS:-30}
      DEMO_RECRUITER_EMAIL: ${DEMO_RECRUITER_EMAIL:-recruiter@example.com}
      SEED_DEMO_JOBS: ${SEED_DEMO_JOBS:-true}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-job_talk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-24}
      SESSION_TOKEN_PEPPER: ${SESSION_TOKEN_PEPPER:-dev-only-session-token-pepper}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-20}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1000}
      AI_MAX_CALLS_PER_CHAT: ${AI_MAX_CALLS_PER_CHAT:-12}
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-true}
    command:
      - /bin/sh
      - -c
      - |
        requirements_hash="$$(sha256sum requirements.txt | cut -d ' ' -f 1)"
        marker="/opt/venv/.requirements-$$requirements_hash"
        if [ ! -x /opt/venv/bin/uvicorn ] || [ ! -f "$$marker" ]; then
          python -m venv /opt/venv
          /opt/venv/bin/pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
          rm -f /opt/venv/.requirements-*
          touch "$$marker"
        fi
        /bin/sh /app/docker-entrypoint.sh uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    image: node:20-alpine
    working_dir: /app
    init: true
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
      VITE_DEV_MAILBOX_URL: http://localhost:${MAILPIT_UI_PORT:-8025}
      VITE_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@example.com}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
    command:
      - /bin/sh
      - -c
      - |
        lock_hash="$$(sha256sum package-lock.json | cut -d ' ' -f 1)"
        marker="node_modules/.package-lock-$$lock_hash"
        if [ ! -x node_modules/.bin/vite ] || [ ! -f "$$marker" ]; then
          npm ci --no-audit --no-fund
          rm -f node_modules/.package-lock-*
          touch "$$marker"
        fi
        npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  job_talk_data:
  backend_venv:
  frontend_node_modules:
