name: job_talk

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - job_talk_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          memory: 256M

  backend:
    image: job-talk-backend:${JOB_TALK_IMAGE_TAG:?Set JOB_TALK_IMAGE_TAG to the deployed Git commit}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      APP_ENV: production
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env.production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env.production}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env.production}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL in .env.production}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env.production}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME in .env.production}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env.production}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in .env.production}
      RECRUITER_CODE_TTL_MINUTES: ${RECRUITER_CODE_TTL_MINUTES:-10}
      RECRUITER_CODE_MAX_ATTEMPTS: ${RECRUITER_CODE_MAX_ATTEMPTS:-5}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-24}
      SESSION_TOKEN_PEPPER: ${SESSION_TOKEN_PEPPER:?Set SESSION_TOKEN_PEPPER in .env.production}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-20}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-180}
      AI_MAX_CALLS_PER_CHAT: ${AI_MAX_CALLS_PER_CHAT:-12}
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - ${FORWARDED_ALLOW_IPS:-*}
    expose:
      - "8000"
    networks:
      - proxy_backend
      - database
      - outbound
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 128M

  frontend:
    image: job-talk-frontend:${JOB_TALK_IMAGE_TAG:?Set JOB_TALK_IMAGE_TAG to the deployed Git commit}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_DEV_MAILBOX_URL: ""
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=16m
    expose:
      - "80"
    networks:
      - proxy_frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 32M

  proxy:
    image: job-talk-proxy:${JOB_TALK_IMAGE_TAG:?Set JOB_TALK_IMAGE_TAG to the deployed Git commit}
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
      CERTIFICATE_RELOAD_SECONDS: ${CERTIFICATE_RELOAD_SECONDS:-3600}
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - ${STAGING_HTPASSWD_PATH:-./secrets/nginx/.htpasswd}:/etc/nginx/auth/.htpasswd:ro
    tmpfs:
      - /etc/nginx/conf.d:size=1m
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=16m
    ports:
      - "80:80"
      - "443:443"
    networks:
      - edge
      - proxy_backend
      - proxy_frontend
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "if [ -f /etc/letsencrypt/live/$${APP_DOMAIN}/fullchain.pem ]; then wget --no-check-certificate --quiet --tries=1 --spider https://127.0.0.1/proxy-health; else wget --quiet --tries=1 --spider http://127.0.0.1/proxy-health; fi"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 32M

  certbot:
    image: certbot/certbot@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    profiles:
      - certificate-tools
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - edge

  certbot-renew:
    image: certbot/certbot@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    restart: unless-stopped
    init: true
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        trap 'exit 0' TERM INT
        while :; do
          certbot renew --webroot --webroot-path /var/www/certbot --quiet
          sleep 43200 & wait $$!
        done
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - edge
    depends_on:
      proxy:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M
        reservations:
          memory: 32M

networks:
  edge:
  proxy_backend:
    internal: true
  proxy_frontend:
    internal: true
  database:
    internal: true
  outbound:

volumes:
  job_talk_data:
  letsencrypt:
  certbot_www:
